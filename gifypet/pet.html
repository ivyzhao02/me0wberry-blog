<html lang="en">

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.35" />
        <title>GifyPet</title>
        <link rel="stylesheet" type="text/css" href="pet.css?v=0" />
    </head>

    <body>
        <table id="petTable">
            <tr>
                <td>Name: <b id="petName"></b></td>
                <td>Born: <b id="dob"></b></td>
                <td><img class="uiicon" src="ui/zap.png" alt="" aria-hidden="true" />: <b id="element"></b></td>
            </tr>
            <tr>
                <td>Mood: <b id="mood"></b></td>
                <td>Belly: <b id="belly"></b></td>
                <td>Coins: <b id="coins"></b></td>
            </tr>
            <tr>
                <td colspan="2">
                    <div id="map">
                        <div id="underlay"></div>
                        <div id="pet" class="pet">
                            <div id="petName-tag"></div>
                            <!-- <img id="petHat" src="ui/santa_hat.png" /> -->
                        </div>
                    </div>
                    <div id="overlay"></div>
                    <div onclick="pettPet();" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pettPet();}" id="overlay-pet-interact" role="button" tabindex="0" aria-label="pet the virtual pet"></div>
                </td>

                <td class="controls">
                    <b>Shop: (5c)</b>
                    <img class="shopitem" src="ui/burger.png" alt="buy burger" role="button" tabindex="0" onclick="feedPet(0);" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();feedPet(0);}" />
                    <img class="shopitem" src="ui/meat.png" alt="buy meat" role="button" tabindex="0" onclick="feedPet(0);" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();feedPet(0);}" />
                    <img class="shopitem" src="ui/coke.png" alt="buy soda" role="button" tabindex="0" onclick="feedPet(3);" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();feedPet(3);}" />
                    <br />
                    <img class="shopitem" src="ui/bread.png" alt="buy bread" role="button" tabindex="0" onclick="feedPet(2);" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();feedPet(2);}" />
                    <img class="shopitem" src="ui/muffin.png" alt="buy muffin" role="button" tabindex="0" onclick="feedPet(1);" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();feedPet(1);}" />
                    <img class="shopitem" src="ui/icecream.png" alt="buy ice cream" role="button" tabindex="0" onclick="feedPet(1);" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();feedPet(1);}" />
                    <b>Actions:</b>
                    <input type="button" value="Hello" onclick="talkToPet();" />
                    <input type="button" value="Wash 10c" onclick="showerPet();" />
                    <input type="button" value="Party 20c" onclick="petParty();" />
                </td>
            </tr>
            <tr>
                <td colspan="3">
                    <textarea id="talk" disabled="true" aria-label="virtual pet messages"></textarea>
                </td>
            </tr>
        </table>
        <footer>GET A <a href="https://gifypet.neocities.org/" target="_blank">GIFYPET!</a> - MADE BY <a href="https://www.melonking.net" target="_blank">MK</a> &lt;3 - v0.2.1</footer>

        <script src="pet.js?v=0" charset="utf-8"></script>
    </body>
</html>
