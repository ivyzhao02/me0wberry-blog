            </tr>
            <tr>
                <td colspan="2">
                    <div id="map">
                        <div id="underlay"></div>
                        <div id="pet" class="pet">
                            <div id="petName-tag"></div>
                            <!-- <img id="petHat" src="ui/santa_hat.png" /> -->
                        </div>
                    </div>
                    <div id="overlay"></div>
                    <div onclick="pettPet();" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pettPet();}" id="overlay-pet-interact" role="button" tabindex="0" aria-label="pet the virtual pet"></div>

                    <b>Shop: (5c)</b>

                    <img class="shopitem" src="ui/meat.png" alt="buy meat" role="button" tabindex="0" onclick="feedPet(0);" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();feedPet(0);}" />

                    <br />
                    <img class="shopitem" src="ui/bread.png" alt="buy bread" role="button" tabindex="0" onclick="feedPet(2);" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();feedPet(2);}" />
                    <img class="shopitem" src="ui/muffin.png" alt="buy muffin" role="button" tabindex="0" onclick="feedPet(1);" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();feedPet(1);}" />

                    <b>Actions:</b>
                    <input type="button" value="Hello" onclick="talkToPet();" />

                    <input type="button" value="Party 20c" onclick="petParty();" />
